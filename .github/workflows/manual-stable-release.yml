name: Manual AOSP Build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: manual-aosp-build
  cancel-in-progress: false

jobs:
  build_and_send:
    name: Build AOSP APK and send to private chat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Telegram private chat
        id: telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 .github/bot.py --check

      - name: Select signing mode
        id: signing
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os

          names = (
              "SIGNING_KEY_STORE_BASE64",
              "SIGNING_STORE_PASSWORD",
              "SIGNING_KEY_ALIAS",
              "SIGNING_KEY_PASSWORD",
          )
          configured = [name for name in names if os.environ.get(name)]
          missing = [name for name in names if not os.environ.get(name)]
          if configured and missing:
              raise SystemExit(
                  "Incomplete custom signing configuration: " + ", ".join(missing)
                  + ". Complete all four secrets, or remove all SIGNING_* secrets "
                  "to use automatic debug signing."
              )
          custom = bool(configured)
          mode = "custom signing" if custom else "automatic debug signing (no signing secrets needed)"
          print(f"Using {mode}.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"custom={'true' if custom else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"Signing: {mode}\n")
          PY

      - name: Merge upstream application code
        id: upstream
        run: |
          set -euo pipefail
          FORK_SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/wxxsfxyzm/InstallerX-Revived.git
          git fetch --no-tags upstream main
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"

          # Merge only in this runner. Do not push changes back to the fork.
          MERGE_STATUS=0
          git merge --no-commit --no-ff upstream/main || MERGE_STATUS=$?

          # Keep this fork's workflows and private-chat sender, including deletions.
          # Clear merge stages first: restore alone cannot resolve modify/delete
          # conflicts for workflows that are absent from the fork's snapshot.
          git rm -r -f --ignore-unmatch -- .github/
          git restore --source="$FORK_SHA" --staged --worktree -- .github/

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Upstream application code has merge conflicts. Resolve them in the fork before retrying."
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          fi
          if [ "$MERGE_STATUS" -ne 0 ] && ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            echo "::error::Upstream merge failed."
            exit 1
          fi
          echo "Upstream source: $UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'microsoft'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Persist reusable Gradle state for subsequent manual builds.
          cache-read-only: false

      - name: Decode and validate signing key
        if: ${{ steps.signing.outputs.custom == 'true' }}
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          if [ -e keystore.properties ]; then
            echo "::error::Unexpected keystore.properties; refusing to override personal signing."
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/installerx-signing.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/installerx-signing.jks" \
            -storepass:env SIGNING_STORE_PASSWORD \
            -alias "$SIGNING_KEY_ALIAS" >/dev/null

      - name: Set version
        id: version
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import os
          import re

          # Retain the fork's existing version format, using the user's timezone.
          build_date = datetime.now(ZoneInfo("Asia/Shanghai")).strftime("%Y%m%d")
          version_name = f"222222.33 ({build_date})"
          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          for key, value in (
              ("versionCode", build_date),
              ("versionName", f'"{version_name}"'),
          ):
              source, count = re.subn(
                  rf"(?m)^([ \t]*){key}[ \t]*=[^\r\n]*$",
                  lambda match: f"{match[1]}{key} = {value}",
                  source,
              )
              if count != 1:
                  raise SystemExit(f"Expected exactly one {key} assignment; review upstream build configuration.")
          path.write_text(source, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_name={version_name}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"APK version: {version_name} [Code: {build_date}]\n")
          PY

      - name: Build AOSP Stable APK
        env:
          CUSTOM_SIGNING: ${{ steps.signing.outputs.custom }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_FILE: ${{ runner.temp }}/installerx-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          # Empty environment variables still count as custom signing in Gradle.
          # Unset all four to use the project's existing debug-keystore fallback.
          if [ "$CUSTOM_SIGNING" != "true" ]; then
            unset KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD
          fi
          chmod +x ./gradlew
          ./gradlew assembleStableRelease \
            -PAPP_ID=com.android.packageinstaller \
            -Porg.gradle.java.installations.auto-download=false

      - name: Collect AOSP APK
        id: apk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          apks = [
              path for path in Path("app/build/outputs/apk").rglob("*.apk")
              if path.parent.name.lower() == "release"
              and path.parent.parent.name.lower() == "stable"
          ]
          if len(apks) != 1:
              raise SystemExit(f"Expected exactly one AOSP Stable APK, found {len(apks)}.")
          destination = Path(os.environ["RUNNER_TEMP"]) / "PackageInstaller.apk"
          shutil.copyfile(apks[0], destination)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={destination}\n")
          PY

      - name: Send APK to Telegram private chat
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          python3 .github/bot.py "$APK_PATH" \
            --caption "InstallerX AOSP | $VERSION_NAME | upstream $UPSTREAM_SHA"

      - name: Notify private chat of failure
        if: ${{ failure() && steps.telegram.outcome == 'success' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/bot.py --text "InstallerX AOSP 构建或发送失败，请查看日志：$RUN_URL"

      - name: Remove signing material
        if: ${{ always() }}
        run: rm -f -- "$RUNNER_TEMP/installerx-signing.jks"
